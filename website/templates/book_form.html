{% extends "base.html" %}
{% block content %}
<h2>{{ mode }} book</h2>
<form method="post" class="card">
  <label>Title <input name="title" maxlength="150" value="{{ book.title or '' }}"></label>
  <label>Price <input name="price" type="number" step="0.01" min="0" value="{{ book.price or '' }}"></label>
  <label>Author
    <select name="author_id">
      <option value="">-- choose --</option>
      {% for a in authors %}
      <option value="{{ a.author_id }}" {% if book.author_id|string == a.author_id|string %}selected{% endif %}>
        {{ a.name }} (#{{ a.author_id }})
      </option>
      {% endfor %}
    </select>
  </label>
  <button class="btn">Save</button>
  <a href="{{ url_for('index') }}">Cancel</a>
</form>
{% endblock %}
